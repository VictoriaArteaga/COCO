name: Build smartwatch APK

on:
  push:
    branches: [master]
    paths:
      - 'smartwatch/**'
      - 'gradle/**'
      - '*.kts'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BACKEND_URL: https://coco-iaii.onrender.com/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :smartwatch:app:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: coco-smartwatch-debug-apk
          path: smartwatch/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
