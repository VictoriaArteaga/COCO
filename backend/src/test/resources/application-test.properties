# =====================================================
# COCO Backend -- Configuración para pruebas (H2)
# =====================================================

spring.datasource.url=jdbc:h2:mem:coco_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=VALUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Deshabilitar Flyway en tests (Hibernate crea el esquema)
spring.flyway.enabled=false

coco.cors.allowed-origins=http://localhost:3000
coco.jwt.secret=ZmFrZS1leGFtcGxlLWtleS1vbmx5LW5vdC1mb3ItcHJvZA==

logging.level.com.coco=DEBUG
