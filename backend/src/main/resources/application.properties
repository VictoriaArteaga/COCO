# =====================================================
# COCO Backend -- Configuración principal
# Las credenciales se inyectan desde variables de entorno
# NUNCA escribir valores sensibles directamente aquí
# =====================================================

spring.application.name=coco-backend

# Desarrollo local: almacenamiento efímero en memoria (se pierde al detener el backend).
# PostgreSQL se activa explícitamente con SPRING_PROFILES_ACTIVE=postgres.
spring.datasource.url=jdbc:h2:mem:coco_demo;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=VALUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Configuración del pool de conexiones
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway (migraciones)
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# Servidor
server.port=${SERVER_PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# CORS -- orígenes permitidos (desarrollo local)
coco.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
coco.jwt.secret=${JWT_SECRET}
coco.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}

# Logging
logging.level.com.coco=INFO
logging.level.org.springframework.security=WARN

gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
gemini.timeout-seconds=${GEMINI_TIMEOUT_SECONDS:20}
